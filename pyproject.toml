[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reliable-transfer"
version = "1.0.0"
description = "UDP best-effort, stop-and-wait, and optional sliding-window transfer demo"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
reliable-transfer = "stopwait.cli:main"
mini-internet = "miniinternet.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
